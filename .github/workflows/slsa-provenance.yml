name: SLSA Provenance

# Generate SLSA Level 3 provenance for release artifacts
# See: https://slsa.dev/ and https://github.com/slsa-framework/slsa-github-generator

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to generate provenance for"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Build the Ansible collection tarball and generate hash
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build Ansible collection tarball
        run: |
          pip install ansible-core
          # galaxy.yml is not bumped by semantic-release, so stamp the release version from the tag
          sed -i "s/^version: .*/version: ${TAG#v}/" galaxy.yml
          ansible-galaxy collection build
          ls -la "robertyoung-homelab-${TAG#v}.tar.gz"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Generate artifact hash
        id: hash
        run: |
          # Generate SHA256 hash in the format expected by SLSA generator
          HASH=$(sha256sum "robertyoung-homelab-${TAG#v}.tar.gz" | base64 -w0)
          echo "hashes=${HASH}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: robertyoung-homelab-*.tar.gz
          retention-days: 5
          if-no-files-found: error

  # Generate SLSA provenance using the official generator
  provenance:
    name: Generate SLSA Provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.build.outputs.tag }}

  # Upload the release artifact to GitHub release and submit attestation
  release:
    name: Upload Release Artifact
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact

      - name: Upload artifact to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: robertyoung-homelab-*.tar.gz

      - name: Submit attestation to GitHub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: robertyoung-homelab-*.tar.gz
