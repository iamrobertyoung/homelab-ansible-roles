---

- name: Save provisioner password
  become: true
  ansible.builtin.copy:
    content: "{{ ansible_provisioner_password }}"
    dest: "{{ ansible_provisioner_password_file }}"
    mode: '0600'

- name: Create service certificate using step-ca
  become: true
  ansible.builtin.command:
    cmd: >-
      step ca certificate {{ service_cert_name }} {{ service_cert_file }} {{ service_key_file }}
      --provisioner ansible
      --provisioner-password-file {{ ansible_provisioner_password_file }}
      --force
  args:
    creates: "{{ service_cert_file }}"

- name: "Create cert-renewer systemd service file"
  become: true
  ansible.builtin.template:
    src: "templates/cert-renewer/cert-renewer.service.j2"
    dest: /etc/systemd/system/cert-renewer.service
    owner: root
  register: cert_renewer_service

- name: "Create cert-renewer systemd timer file"
  become: true
  ansible.builtin.template:
    src: "templates/cert-renewer/cert-renewer.timer.j2"
    dest: /etc/systemd/system/cert-renewer.timer
    owner: root
  register: cert_renewer_timer

- name: "Reload systemd"
  become: true
  changed_when: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: cert_renewer_service.changed or cert_renewer_timer.changed
  register: systemd_reload

- name: "Start cert-renewer timer"
  become: true
  command: "systemctl enable --now cert-renewer.timer"
  when: systemd_reload.changed
