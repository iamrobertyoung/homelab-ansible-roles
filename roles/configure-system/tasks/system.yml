# Clean up /tmp directory
- name: Clean up files in /tmp older than specified days
  become: true
  ansible.builtin.cron:
    name: "Clean tmp files"
    hour: "2"
    minute: "30"
    job: "find /tmp -type f -mtime +{{ tmp_cleanup_days }} -delete"
    state: present
